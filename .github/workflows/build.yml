name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只依赖系统自带的 .NET Framework 编译器（csc.exe），无需 SDK
      - name: Compile with in-box csc
        shell: powershell
        run: .\build\build.ps1 -OutDir .\outputs -BuildTests

      - name: Run core tests (59 cases)
        shell: powershell
        run: |
          .\work\CoreTests.exe 2>&1 | Tee-Object -FilePath .\work\test-output.txt
          exit $LASTEXITCODE

      - name: Upload built exe
        uses: actions/upload-artifact@v4
        with:
          name: MODManager-ci-build
          path: outputs/*.exe

      - name: Upload test log
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-log
          path: work/test-output.txt